<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字2048 | 2048 Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none;touch-action:none}
.lang-btn{position:fixed;top:16px;left:16px;background:transparent;border:2px solid #00BCD4;color:#00BCD4;font-size:12px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;z-index:10;letter-spacing:1px}
.lang-btn:hover{background:#00BCD4;color:#fff}
.fullscreen-btn{position:fixed;top:16px;right:16px;background:#00BCD4;color:#fff;border:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;z-index:10;font-family:inherit}
.fullscreen-btn:hover{background:#0097A7}
.main{display:flex;flex-direction:column;align-items:center;gap:16px}
.score-panel{display:flex;gap:24px;align-items:center}
.score-box{text-align:center}
.score-label{font-size:11px;color:#aaa;letter-spacing:2px;text-transform:uppercase}
.score-value{font-size:28px;font-weight:300;color:#00BCD4;letter-spacing:2px}
.new-btn{background:transparent;border:2px solid #00BCD4;color:#00BCD4;font-size:13px;font-weight:700;padding:8px 20px;border-radius:6px;cursor:pointer;letter-spacing:1px;transition:all .2s}
.new-btn:hover{background:#00BCD4;color:#fff}
.grid-container{position:relative}
canvas{border-radius:8px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);border-radius:8px;flex-direction:column;gap:12px;display:none}
.overlay.show{display:flex}
.overlay-text{font-size:28px;font-weight:300;color:#00BCD4;letter-spacing:3px}
.overlay-sub{font-size:13px;color:#999;letter-spacing:1px}
.overlay-btn{background:#00BCD4;color:#fff;border:none;font-size:14px;font-weight:700;padding:10px 32px;border-radius:6px;cursor:pointer;letter-spacing:2px;margin-top:8px}
.overlay-btn:hover{opacity:.85}
.hint{font-size:11px;color:#ccc;letter-spacing:1px;text-align:center}
</style>
</head>
<body>
<button class="lang-btn" onclick="toggleLang()" id="langBtn">中/EN</button>
<button class="fullscreen-btn" onclick="toggleFullscreen()" id="fsBtn">全屏</button>
<div class="main">
  <div class="score-panel">
    <div class="score-box"><div class="score-label" id="scoreLabel" data-key="score">SCORE</div><div class="score-value" id="scoreVal">0</div></div>
    <div class="score-box"><div class="score-label" id="bestLabel" data-key="best">BEST</div><div class="score-value" id="bestVal">0</div></div>
    <button class="new-btn" id="newBtn" onclick="newGame()" data-key="newGame">新游戏</button>
  </div>
  <div class="grid-container">
    <canvas id="canvas" width="360" height="360"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-text" id="overlayText">Game Over</div>
      <div class="overlay-sub" id="overlaySub"></div>
      <button class="overlay-btn" id="overlayBtn" onclick="newGame()" data-key="restart">重新开始</button>
    </div>
  </div>
  <div class="hint" id="hint" data-key="hint">方向键 / 滑动操作</div>
</div>
<script>
let lang='zh';
const L={
zh:{score:'分数',best:'最佳',newGame:'新游戏',gameOver:'游戏结束',youWin:'恭喜！',restart:'重新开始',hint:'方向键 / 滑动操作'},
en:{score:'Score',best:'Best',newGame:'New Game',gameOver:'Game Over',youWin:'You Win!',restart:'Restart',hint:'Arrow Keys / Swipe'}
};
function t(k){return L[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';updateTexts()}
function updateTexts(){
  document.querySelectorAll('[data-key]').forEach(el=>{let k=el.getAttribute('data-key');if(L[lang][k])el.textContent=L[lang][k]});
  if(gameOver){document.getElementById('overlayText').textContent=won?t('youWin'):t('gameOver')}
}
function toggleFullscreen(){
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){let e=document.documentElement;e.requestFullscreen?e.requestFullscreen():e.webkitRequestFullscreen()}else{document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen()}
}
const SIZE=4,canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const cellSize=80,gap=8,pad=12,cellR=6;
let board=[],score=0,best=0,gameOver=false,won=false;
function initBoard(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));score=0;gameOver=false;won=false;document.getElementById('overlay').classList.remove('show');addRandom();addRandom();updateScore();draw()}
function addRandom(){let empty=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c]===0)empty.push([r,c]);if(empty.length===0)return;let[r,c]=empty[Math.floor(Math.random()*empty.length)];board[r][c]=Math.random()<0.9?2:4}
function updateScore(){document.getElementById('scoreVal').textContent=score;if(score>best){best=score;document.getElementById('bestVal').textContent=best;try{localStorage.setItem('2048_best',best)}catch(e){}}}
function draw(){
  ctx.fillStyle='#f0f8f9';roundRect(0,0,360,360,10);ctx.fill();
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    let x=pad+c*(cellSize+gap),y=pad+r*(cellSize+gap),v=board[r][c];
    ctx.fillStyle=v===0?'#f0f8f9':getBgColor(v);roundRect(x,y,cellSize,cellSize,cellR);ctx.fill();
    if(v!==0){
      ctx.fillStyle=v<=4?'#666':'#fff';ctx.font=(v>=1024?'22px':'28px')+' "SF Pro Display","Helvetica Neue",Arial,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,x+cellSize/2,y+cellSize/2)}
  }
}
function getBgColor(v){let colors={2:'#e0f7fa',4:'#b2ebf2',8:'#80deea',16:'#4dd0e1',32:'#26c6da',64:'#00BCD4',128:'#00acc1',256:'#0097a7',512:'#00838f',1024:'#006064',2048:'#004d40'};return colors[v]||'#00251a'}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function move(dir){
  if(gameOver)return;
  let old=board.map(r=>[...r]),moved=false,merged=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  function slide(arr){
    let res=[],skip=false;
    for(let i=0;i<arr.length;i++){
      if(arr[i]===0)continue;
      if(res.length>0&&res[res.length-1]===arr[i]&&!skip){
        res[res.length-1]*=2;score+=res[res.length-1];skip=true;
        if(res[res.length-1]===2048)won=true
      }else{res.push(arr[i]);skip=false}
    }while(res.length<arr.length)res.push(0);return res
  }
  for(let i=0;i<SIZE;i++){
    let line=[];
    for(let j=0;j<SIZE;j++)line.push(dir==='left'?board[i][j]:dir==='right'?board[i][SIZE-1-j]:dir==='up'?board[j][i]:board[SIZE-1-j][i]);
    if(dir==='right'||dir==='down')line.reverse();
    let merged_line=slide(line);
    if(dir==='right'||dir==='down')merged_line.reverse();
    for(let j=0;j<SIZE;j++){
      let val=merged_line[j],nr=dir==='left'||dir==='right'?i:j,nc=dir==='left'||dir==='right'?j:i;
      if(dir==='right')nc=SIZE-1-j;if(dir==='down')nr=SIZE-1-j;
      if(board[nr][nc]!==val)moved=true;board[nr][nc]=val
    }
  }
  if(moved){addRandom();updateScore();draw();checkGameOver();if(won&&!gameOver){document.getElementById('overlayText').textContent=t('youWin');document.getElementById('overlaySub').textContent='';document.getElementById('overlay').classList.add('show')}}
}
function checkGameOver(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0)return;if(c<3&&board[r][c]===board[r][c+1])return;if(r<3&&board[r][c]===board[r+1][c])return}
  gameOver=true;document.getElementById('overlayText').textContent=t('gameOver');document.getElementById('overlaySub').textContent=t('score')+': '+score;document.getElementById('overlay').classList.add('show')}
function newGame(){initBoard();updateTexts()}
document.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});
let touchX=0,touchY=0;
canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;e.preventDefault()});
canvas.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY,absDx=Math.abs(dx),absDy=Math.abs(dy);
  if(Math.max(absDx,absDy)<20)return;
  move(absDx>absDy?(dx>0?'right':'left'):(dy>0?'down':'up'))});
try{let b=localStorage.getItem('2048_best');if(b)best=parseInt(b);document.getElementById('bestVal').textContent=best}catch(e){}
initBoard();updateTexts();
</script>
</body>
</html>
