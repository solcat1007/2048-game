<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048 · 数字合并游戏 v2.0</title>
<meta name="description" content="2048 v2.0：撤销一步、四套主题、合并动画、最高分、自动存档与键盘/触控双操作">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#edc22e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2048">
<style>

:root{
  --bg:#f4f5f7;
  --bg-glow:#ffffff;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --text:#16181d;
  --soft:#5d636e;
  --mute:#8b929e;
  --line:#e6e8ec;
  --accent:#26a69a;
  --accent-soft:#e6f4f2;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:18px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow);
}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center}
.stats{display:flex; gap:10px; width:100%}
.stat{
  flex:1; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px; text-align:center;
}
.stat .k{font-size:11px; color:var(--mute); letter-spacing:1px}
.stat .v{font-size:21px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}

.label{font-size:12px; color:var(--soft); font-weight:600; min-width:32px}
.chip{
  padding:7px 14px; font-size:12px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.14)}

.btn{
  padding:12px 30px; font-size:14px; font-weight:600; font-family:inherit;
  letter-spacing:2px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}
.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

.grid{
  width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(4,1fr);
  gap:9px; padding:9px; border-radius:var(--r-md);
  background:#bbada0; touch-action:none;
}
.cell{
  border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:700; color:#776e65;
  background:rgba(238,228,218,.35);
  transition:background .18s var(--ease), color .18s var(--ease);
}
.cell.pop{animation:cellPop .22s var(--ease)}
.cell.spawn{animation:cellSpawn .2s var(--ease)}
.cell.legend{box-shadow:inset 0 0 0 2px #ffca28, 0 0 18px rgba(255,202,40,.65)}
@keyframes cellPop{0%{transform:scale(.72)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes cellSpawn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.dpad{
  display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,46px);
  gap:6px; justify-content:center; margin-top:14px;
}
.dpad button{
  font-family:inherit; font-size:18px; color:var(--soft);
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-sm); cursor:pointer; user-select:none; -webkit-user-select:none;
  touch-action:manipulation; transition:all .12s var(--ease);
}
.dpad button:active{background:var(--accent); color:#fff; transform:scale(.94)}
.dpad .up{grid-column:2}
.dpad .left{grid-column:1; grid-row:2}
.dpad .down{grid-column:2; grid-row:2}
.dpad .right{grid-column:3; grid-row:2}

@media (max-width:380px){
  .dpad{grid-template-columns:repeat(3,46px); grid-template-rows:repeat(2,42px)}
  .cell{font-size:22px}
}

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">2048</h1>
    <p id="t_sub">滑动合并相同的数字</p>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k" id="t_score">分数</div><div class="v" id="vScore">0</div></div>
      <div class="stat"><div class="k" id="t_best">最高</div><div class="v" id="vBest">0</div></div>
      <div class="stat"><div class="k" id="t_steps">步数</div><div class="v" id="vSteps">0</div></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:12px"><span class="label" id="t_theme">主题</span><div class="row" id="themes"></div></div>
    <div class="grid" id="grid"></div>
    <div class="dpad">
      <button class="up" data-dir="up" aria-label="up">▲</button>
      <button class="left" data-dir="left" aria-label="left">◀</button>
      <button class="down" data-dir="down" aria-label="down">▼</button>
      <button class="right" data-dir="right" aria-label="right">▶</button>
    </div>
  </div>

  <div class="meta" id="over" style="display:none"></div>

  <div class="row">
    <button class="btn" id="newBtn" onclick="newGame()">新游戏</button>
    <button class="btn ghost" id="undoBtn" onclick="undo()">撤销</button>
  </div>

  <div class="hint" id="t_hint">方向键 / WASD 或滑动屏幕移动方块</div>

</div>
<script>

/* ============================================================
 * 2048 v2.0
 * ------------------------------------------------------------
 * 数据结构：grid 是一维数组，长度 16，索引 = row*4 + col。
 * 滑动算法：压缩 → 相邻相同合并一次 → 再压缩补零。
 *
 * v2.0 新增：
 *   1. 撤销（保存最近 12 步的完整快照）
 *   2. 四套主题，颜色由 THEMES 表驱动，渲染时写入内联样式
 *   3. 合并/新增方块分别用 pop / spawn 关键帧动画
 *   4. 自动存档：每一步都把 grid/score/撤销栈写入 localStorage
 *   5. 合成 2048 / 4096 触发专属彩蛋
 * ========================================================== */

const SIZE = 4;
const SAVE_KEY = 'g2048_state_v2';

const THEMES = {
  classic:{ label:'经典', grid:'#bbada0', empty:'rgba(238,228,218,.35)', text:'#776e65',
    colors:{ 2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e' } },
  ocean:{ label:'海洋', grid:'#2c7da0', empty:'rgba(225,240,245,.18)', text:'#e8f4f8',
    colors:{ 2:'#d9f0f7',4:'#a8dce8',8:'#7cc9de',16:'#4eb4d1',32:'#2f9fc4',64:'#2389ad',128:'#1c7599',256:'#176184',512:'#124e6b',1024:'#0e3d55',2048:'#092c40' } },
  dark:{ label:'暗夜', grid:'#2f3542', empty:'rgba(255,255,255,.06)', text:'#d1d8e0',
    colors:{ 2:'#576574',4:'#8395a7',8:'#c8d6e5',16:'#feca57',32:'#ff9ff3',64:'#54a0ff',128:'#5f27cd',256:'#ee5a24',512:'#c23616',1024:'#00d2d3',2048:'#ff9f43' } },
  neon:{ label:'霓虹', grid:'#160a2a', empty:'rgba(180,120,255,.10)', text:'#f3e9ff',
    colors:{ 2:'#4a2d70',4:'#6c3fa0',8:'#9d4edd',16:'#c77dff',32:'#e0aaff',64:'#7b2cbf',128:'#5a189a',256:'#3c096c',512:'#9d4edd',1024:'#e0aaff',2048:'#ffd6ff' } }
};

let grid = [];
let score = 0;
let best = 0;
let steps = 0;
let over = false;
let theme = 'classic';
let history = [];              /* 撤销栈：{grid, score, steps} */
let lastMerged = [], lastSpawn = -1;
let lang = 'zh';

/* ---------- 存档 ---------- */
function loadBest(){
  try { return parseInt(localStorage.getItem('g2048_best')||'0',10)||0; }
  catch(e){ return 0; }        /* 隐私模式下 localStorage 可能抛异常，兜底返回 0 */
}
function saveBest(){
  try { localStorage.setItem('g2048_best', String(best)); } catch(e){}
}
function saveGame(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      grid:grid, score:score, best:best, steps:steps, over:over, theme:theme,
      history:history.slice(-12)
    }));
  } catch(e){}
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.grid) || s.grid.length !== SIZE*SIZE) return false;
    grid = s.grid.map(function(v){ return Number(v)||0; });
    score = Number(s.score)||0;
    best  = Number(s.best)||0;
    steps = Number(s.steps)||0;
    over  = !!s.over;
    theme = THEMES[s.theme] ? s.theme : 'classic';
    history = Array.isArray(s.history) ? s.history.slice(-12) : [];
    return true;
  } catch(e){ return false; }
}

/* ---------- 初始化 ---------- */
function newGame(){
  grid = new Array(SIZE*SIZE).fill(0);
  score = 0; steps = 0; over = false;
  history = []; lastMerged = []; lastSpawn = -1;
  addRandom(); addRandom();
  buildThemes();
  render();
  saveGame();
}

/** 在随机空位生成新块（90% 概率 2，10% 概率 4），返回其索引 */
function addRandom(){
  const empty = [];
  for (let i=0;i<grid.length;i++) if (grid[i]===0) empty.push(i);
  if (!empty.length) return -1;
  const idx = empty[Math.floor(Math.random()*empty.length)];
  grid[idx] = Math.random() < 0.9 ? 2 : 4;
  return idx;
}

/* ---------- 滑动核心 ---------- */

/** 压缩 → 合并 → 补零，并返回合并发生的位置（用于动画） */
function mergeLine(line){
  let arr = line.filter(function(v){ return v !== 0; });
  let gained = 0;
  const out = [], merged = [];
  for (let i=0;i<arr.length;i++){
    if (i+1 < arr.length && arr[i] === arr[i+1]){
      const v = arr[i]*2;
      merged.push(out.length);
      out.push(v);
      gained += v;
      i++;                     /* 一次滑动只合并一次 */
    } else {
      out.push(arr[i]);
    }
  }
  while (out.length < SIZE) out.push(0);
  return { line:out, gained:gained, merged:merged };
}

function getRow(r){ return [0,1,2,3].map(function(c){ return grid[r*SIZE+c]; }); }
function setRow(r, vals){ for (let c=0;c<SIZE;c++) grid[r*SIZE+c] = vals[c]; }
function getCol(c){ return [0,1,2,3].map(function(r){ return grid[r*SIZE+c]; }); }
function setCol(c, vals){ for (let r=0;r<SIZE;r++) grid[r*SIZE+c] = vals[r]; }

/** 按方向滑动，返回棋盘是否发生变化 */
function move(dir){
  if (over) return false;

  const before = grid.join(',');
  const snapshot = { grid:grid.slice(), score:score, steps:steps };
  let gained = 0;
  lastMerged = [];

  for (let i=0;i<SIZE;i++){
    if (dir === 'left'){
      const res = mergeLine(getRow(i)); setRow(i, res.line); gained += res.gained;
      res.merged.forEach(function(k){ lastMerged.push(i*SIZE+k); });
    } else if (dir === 'right'){
      const res = mergeLine(getRow(i).slice().reverse());
      setRow(i, res.line.slice().reverse()); gained += res.gained;
      res.merged.forEach(function(k){ lastMerged.push(i*SIZE+(SIZE-1-k)); });
    } else if (dir === 'up'){
      const res = mergeLine(getCol(i)); setCol(i, res.line); gained += res.gained;
      res.merged.forEach(function(k){ lastMerged.push(k*SIZE+i); });
    } else if (dir === 'down'){
      const res = mergeLine(getCol(i).slice().reverse());
      setCol(i, res.line.slice().reverse()); gained += res.gained;
      res.merged.forEach(function(k){ lastMerged.push((SIZE-1-k)*SIZE+i); });
    }
  }

  const changed = (grid.join(',') !== before);
  if (!changed) return false;

  history.push(snapshot);
  if (history.length > 12) history.shift();
  score += gained;
  steps++;
  if (score > best){ best = score; saveBest(); }
  lastSpawn = addRandom();
  checkEgg();
  render();
  saveGame();
  if (!canMove()){ over = true; render(); saveGame(); }
  return true;
}

/** 撤销一步（支持连续撤销） */
function undo(){
  if (!history.length) return;
  const s = history.pop();
  grid = s.grid.slice();
  score = s.score;
  steps = s.steps;
  over = false;
  lastMerged = []; lastSpawn = -1;
  render();
  saveGame();
}

/** 是否还能移动 */
function canMove(){
  for (let i=0;i<grid.length;i++) if (grid[i]===0) return true;
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      const v = grid[r*SIZE+c];
      if (c+1<SIZE && grid[r*SIZE+c+1]===v) return true;
      if (r+1<SIZE && grid[(r+1)*SIZE+c]===v) return true;
    }
  }
  return false;
}

/* ---------- 渲染 ---------- */
function buildThemes(){
  const box = document.getElementById('themes');
  box.innerHTML = '';
  Object.keys(THEMES).forEach(function(k){
    const b = document.createElement('button');
    b.className = 'chip' + (k === theme ? ' active' : '');
    b.textContent = THEMES[k].label;
    b.onclick = function(){ theme = k; buildThemes(); render(); saveGame(); };
    box.appendChild(b);
  });
}

function render(){
  const g = document.getElementById('grid');
  const th = THEMES[theme];
  g.style.background = th.grid;
  g.innerHTML = '';
  grid.forEach(function(v, i){
    const d = document.createElement('div');
    d.className = 'cell';
    if (v){
      d.textContent = v;
      const c = th.colors[v] || th.colors[2048];
      d.style.background = c;
      d.style.color = (v>=8 && theme!=='ocean' && theme!=='dark' && theme!=='neon') ? '#f9f6f2' : th.text;
      d.style.fontSize = v>=1024 ? '18px' : (v>=128 ? '22px' : '26px');
      if (lastMerged.indexOf(i) !== -1) d.classList.add('pop');
      if (i === lastSpawn) d.classList.add('spawn');
      // 专属彩蛋：达成 2048 后给最大方块加金边光晕
      if (v >= 2048 && window.__eggLegend__) d.classList.add('legend');
    } else {
      d.style.background = th.empty;
    }
    g.appendChild(d);
  });

  document.getElementById('vScore').textContent = score;
  document.getElementById('vBest').textContent  = best;
  document.getElementById('vSteps').textContent = steps;
  document.getElementById('undoBtn').disabled = history.length === 0;

  const ov = document.getElementById('over');
  ov.style.display = over ? 'block' : 'none';
  ov.textContent = over ? I18N[lang].over + ' · ' + score : '';
}

/* ---------- 输入 ---------- */
document.addEventListener('keydown', function(e){
  const map = {
    ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
    a:'left', d:'right', w:'up', s:'down',
    A:'left', D:'right', W:'up', S:'down',
    z:'undo', Z:'undo'
  };
  const cmd = map[e.key];
  if (cmd){ e.preventDefault(); if (cmd === 'undo') undo(); else move(cmd); }
});

let tx=0, ty=0;
const gridEl = document.getElementById('grid');
gridEl.addEventListener('touchstart', function(e){
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive:true});
gridEl.addEventListener('touchend', function(e){
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left');
  else                             move(dy>0?'down':'up');
}, {passive:true});

const dirMap = { up:'up', down:'down', left:'left', right:'right' };
document.querySelectorAll('.dpad button').forEach(function(b){
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); move(dirMap[b.getAttribute('data-dir')]); });
});

function refresh(){
  const L = I18N[lang];
  document.getElementById('t_title').textContent = L.title;
  document.getElementById('t_sub').textContent   = L.sub;
  document.getElementById('t_hint').textContent  = L.hint;
  document.getElementById('t_score').textContent = L.score;
  document.getElementById('t_best').textContent  = L.best;
  document.getElementById('t_steps').textContent = L.steps;
  document.getElementById('t_theme').textContent = L.theme;
  document.getElementById('newBtn').textContent  = L.newGame;
  document.getElementById('undoBtn').textContent = L.undo;
  document.getElementById('langBtn').textContent = (lang === 'zh') ? 'EN' : '中';
}

const I18N = {
  zh:{ title:'2048', sub:'滑动合并相同的数字', hint:'方向键 / WASD 或滑动屏幕移动方块 · Z 键撤销',
       score:'分数', best:'最高', steps:'步数', theme:'主题', newGame:'新游戏', undo:'撤销', over:'游戏结束' },
  en:{ title:'2048', sub:'Slide to merge matching tiles', hint:'Arrow keys / WASD or swipe to move · Z to undo',
       score:'Score', best:'Best', steps:'Moves', theme:'Theme', newGame:'New game', undo:'Undo', over:'Game over' }
};

function toggleLang(){ lang = (lang === 'zh') ? 'en' : 'zh'; refresh(); }

/* ---------- 彩蛋接入 ---------- */
function eggUnlock(id, msg){
  const E = window.__SOLCAT_EGG__;
  if (!E || E.unlocked.has(id)) return;
  E.unlocked.add(id);
  E.onUnlock.forEach(function(fn){ try{ fn(id); }catch(e){} });
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:99996;'+
    'background:rgba(18,20,26,.92);color:#ffca28;padding:12px 22px;border:1px solid #ffca28;'+
    'border-radius:12px;font:14px ui-monospace,monospace;pointer-events:none;'+
    'animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
  t.textContent = '☠ ' + msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2400);
}

/** 合成 2048 / 4096 时触发专属解锁 */
function checkEgg(){
  for (let i=0;i<lastMerged.length;i++){
    const v = grid[lastMerged[i]];
    if (v >= 4096) eggUnlock('reach-4096', '4096！SOLCAT 无尽之路');
    else if (v >= 2048) eggUnlock('reach-2048', '抵达 2048！传奇诞生');
  }
}

function initEgg(){
  const E = window.__SOLCAT_EGG__;
  if (!E) return;
  // 专属彩蛋：任意解锁后，最大方块获得金色光晕
  E.onUnlock.push(function(id){
    if (id === 'reach-2048' || id === 'reach-4096' || id === 'konami'){
      window.__eggLegend__ = true;
      render();
    }
  });
}
document.addEventListener('DOMContentLoaded', initEgg);

/* ---------- 启动 ---------- */
best = loadBest();
if (!loadGame()) newGame();
refresh();
buildThemes();
render();

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
<script>
/* ============================================================
 * SOLCAT EASTER EGG PROTOCOL v2.0 — 通用彩蛋引擎
 * 零依赖 · 单文件 · 可注入任意 HTML 项目
 * ============================================================ */
(function(){
  'use strict';
  if (window.__SOLCAT_EGG__) return;
  window.__SOLCAT_EGG__ = { version:'2.0', unlocked:new Set(), onUnlock:[] };

  var E = window.__SOLCAT_EGG__;
  var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  var seq = [], logoClicks = 0, logoTimer = null;

  /* ---------- 1. 控制台署名（ASCII Art） ---------- */
  function banner(){
    var art = '%c\n  ____             _   _       _   _   \n' +
      ' / ___|  ___  _ __| |_(_) __ _| |_| |__  \n' +
      ' \\___ \\ / _ \\| \'__| __| |/ _` | __| \'_ \\ \n' +
      '  ___) | (_) | |  | |_| | (_| | |_| | | |\n' +
      ' |____/ \\___/|_|   \\__|_|\\__,_|\\__|_| |_|\n';
    console.log(art, 'color:#26a69a;font-family:monospace;font-weight:bold');
    console.log('%c☠ SOLCAT EASTER EGG PROTOCOL v2.0 — 你找到了隐藏入口',
      'color:#666;font-size:11px;letter-spacing:1px');
    console.log('%c提示：↑↑↓↓←→←→BA · 连点标题 5 次 · 输入 solcat · Ctrl+Shift+T',
      'color:#999;font-size:10px');
  }

  /* ---------- 2. 烟花彩带粒子 ---------- */
  function confetti(){
    var colors = ['#26a69a','#42a5f5','#ef5350','#ffca28','#ab47bc','#66bb6a','#ff7043'];
    var cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(cvs);
    var ctx = cvs.getContext('2d'), W = cvs.width = innerWidth, H = cvs.height = innerHeight;
    var P = [];
    for (var i=0;i<180;i++) P.push({
      x:W/2+(Math.random()-.5)*120, y:H*.4+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*18, vy:-Math.random()*16-4,
      c:colors[i%colors.length], s:Math.random()*8+4, r:Math.random()*6,
      life:1, spin:(Math.random()-.5)*.3
    });
    var f = 0;
    (function draw(){
      f++; ctx.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.spin; p.life-=.006;
        if(p.life<=0) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      });
      if (f<180) requestAnimationFrame(draw); else cvs.remove();
    })();
  }

  /* ---------- 3. 隐藏开发者面板 ---------- */
  function devPanel(app){
    var old = document.getElementById('__egg_panel');
    if (old){ old.remove(); return; }
    var d = document.createElement('div');
    d.id='__egg_panel';
    d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:99998;width:280px;'+
      'background:rgba(18,20,26,.94);color:#e0e0e0;border:1px solid #26a69a;border-radius:14px;'+
      'padding:18px;font:12px/1.7 ui-monospace,monospace;backdrop-filter:blur(12px);'+
      'box-shadow:0 12px 40px rgba(0,0,0,.4);animation:eggIn .3s ease';
    d.innerHTML='<div style="color:#26a69a;font-weight:bold;font-size:13px;margin-bottom:10px">'+
      '☠ SOLCAT 开发者模式</div>'+
      '<div>应用　　: '+app+'</div>'+
      '<div>协议　　: EGG PROTOCOL v'+E.version+'</div>'+
      '<div>解锁数　: '+E.unlocked.size+'</div>'+
      '<div>UA　　　: '+(navigator.userAgent.slice(0,38))+'…</div>'+
      '<div>屏幕　　: '+innerWidth+'×'+innerHeight+'</div>'+
      '<div>运行时间: '+Math.round(performance.now()/1000)+'s</div>'+
      '<div style="color:#888;margin-top:10px;border-top:1px solid #333;padding-top:8px">'+
      '已解锁: '+Array.from(E.unlocked).join(', ')+'</div>'+
      '<button onclick="this.parentNode.remove()" style="margin-top:12px;width:100%;padding:6px;'+
      'background:#26a69a;color:#fff;border:0;border-radius:6px;cursor:pointer">关闭</button>';
    document.body.appendChild(d);
  }

  /* ---------- 4. 隐藏主题（赛博朋克） ---------- */
  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
</body>
</html>
